<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow auth-card w-100">
      <div class="card-body p-4">
        <h3 class="text-center mb-4">Crear cuenta</h3>

        <div id="mensaje"></div>

        <form id="formRegistro">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Correo</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" minlength="6" required>
          </div>
          <div class="mb-3">
            <label for="password2" class="form-label">Repetir contraseña</label>
            <input type="password" class="form-control" id="password2" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Registrarme</button>
        </form>

        <p class="text-center mt-3 mb-0">
          ¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
